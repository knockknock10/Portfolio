name: Portfolio CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: GitHub Pages static export
        run: npm run build:pages

      - name: Verify GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/404.html
          test -s out/api/github-contributions.json
          test -s out/resume.pdf
          test -s out/papers/SemBind.pdf
          grep -q '/Portfolio/_next/' out/index.html
          grep -q '/Portfolio/images/sanjeev-portrait.webp' out/index.html
          grep -q '/Portfolio/resume.pdf' out/index.html
          grep -q '/Portfolio/papers/SemBind.pdf' out/index.html

      - name: Type check
        run: npx tsc --noEmit
