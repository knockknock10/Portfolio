name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR checks cancel only older checks for the same PR. Production publishing
  # shares one non-cancelling group across push and manual runs.
  group: github-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static GitHub Pages site
        run: npm run build:pages

      - name: Verify critical static outputs
        run: |
          # Verify the real App Router paths exist in the export.
          test -s out/index.html
          test -s out/404.html
          test -s out/about/index.html
          test -s out/contact/index.html
          test -s out/certifications/index.html
          test -s out/internships/index.html
          test -s out/open-source/index.html
          test -s out/problem-solving/index.html
          test -s out/research/index.html
          test -s out/signals/index.html
          test -s out/work/index.html
          test -s out/api/github-contributions.json
          test -s out/api/public-pull-requests.json
          test -s out/robots.txt
          test -s out/sitemap.xml

          # Verify project-site assets use /Portfolio, not the user-site root.
          grep -q '/Portfolio/_next/' out/index.html
          grep -q '/Portfolio/images/hero-scene.webp' out/index.html
          grep -q '/Portfolio/resume.pdf' out/index.html
          grep -q '/Portfolio/papers/SemBind.pdf' out/index.html
          ! grep -q 'https://knockknock10.github.io/resume.pdf' out/index.html
          ! grep -q 'https://knockknock10.github.io/papers/SemBind.pdf' out/index.html

      - name: Add Pages marker
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
