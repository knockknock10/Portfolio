name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static GitHub Pages site
        run: npm run build:pages

      - name: Verify critical static outputs
        run: |
          test -s out/index.html
          test -s out/404.html
          test -s out/api/github-contributions.json
          test -s out/robots.txt
          test -s out/sitemap.xml
          grep -q '/Portfolio/_next/' out/index.html
          grep -q '/Portfolio/images/hero-scene.webp' out/index.html

      - name: Add Pages marker
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
