[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

# Route API requests to the Netlify Function before the SPA fallback.
[[redirects]]
from = "/api/github"
to = "/.netlify/functions/github"
status = 200
force = true

# Client-side React Router fallback for nested pages and refreshes.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
