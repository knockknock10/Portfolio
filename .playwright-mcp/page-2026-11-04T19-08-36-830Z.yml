            - heading "Watermarking speech" [level=2] [ref=f6e211]
          - paragraph [ref=f6e212]: My first-author paper looks at where to hide a watermark in speech so that it survives, and whether a self-supervised model can help choose the spot.
        - generic [ref=f6e213]:
          - generic [ref=f6e215]:
            - 'heading "SemBind: Inspectable Self-Supervised and Spectral Placement for Reference-Based Speech Watermarking" [level=3] [ref=f6e216]'
            - generic [ref=f6e217]:
              - generic [ref=f6e218]:
                - term [ref=f6e219]: Authors
                - definition [ref=f6e220]: Sanjeev Kumar, Aditya Kumar Sahu, Banashree Mandal, Biswajit Maity
              - generic [ref=f6e221]:
                - term [ref=f6e222]: Venue
                - definition [ref=f6e223]: Submitted to IEEE Signal Processing Letters
              - generic [ref=f6e224]:
                - term [ref=f6e225]: Year
                - definition [ref=f6e226]: "2026"
            - paragraph [ref=f6e227]: "A controlled study of reference-based speech-watermark placement across all 2,620 LibriSpeech test-clean utterances, comparing five placement rules over six target SNRs. The HuBERT contribution map is directionally informative: low-contribution placement changes fewer transcripts than high-contribution placement. However, spectral-only placement changes fewer Whisper tiny.en transcripts than joint placement at five of the six tested strengths, so the current joint fusion does not consistently outperform spectral-only placement. The paper identifies local spectral suitability as the stronger operational criterion."
            - generic [ref=f6e228]:
              - link "Read the paper" [ref=f6e229] [cursor=pointer]:
